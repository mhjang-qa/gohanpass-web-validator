services:
  - type: web
    name: go-hanpass-web-validator
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python -m playwright install --with-deps chromium chromium-headless-shell
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 1 --timeout 0 --graceful-timeout 30 --access-logfile -
    healthCheckPath: /api/scenarios
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DB_ID
        value: 5ad73fbd195182bcb4b201fb9d76815f
      - key: SESSION_SECRET
        generateValue: true
      - key: VALIDATOR_USER
        value: qa
      - key: VALIDATOR_PASSWORD
        sync: false
      - key: QA_CONSOLE_SHARED_SECRET
        sync: false
      - key: QA_CONSOLE_ALLOWED_ORIGIN
        value: https://gohanpass-qa-console.onrender.com
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: none
      - key: HEADLESS
        value: "true"
      - key: NOTION_UPLOAD
        value: "true"
      - key: TIMEZONE
        value: Asia/Seoul
